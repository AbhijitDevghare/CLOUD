version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: secplatform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-secadmin}
      POSTGRES_PASSWORD: ${PGPASSWORD:-secpassword}
      POSTGRES_DB: ${PGDATABASE:-cloud_sec_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/001_compliance_controls.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-secadmin} -d ${PGDATABASE:-cloud_sec_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: secplatform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  python-security-service:
    build:
      context: ./python-security-service
      dockerfile: Dockerfile
    container_name: secplatform-python
    restart: unless-stopped
    environment:
      PYTHON_SERVICE_PORT: 8000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secplatform_internal_hmac_secret_change_in_prod_9f8a7b6c5d4e3f2a}
      REDIS_URL: redis://redis:6379/0
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secplatform-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${PGUSER:-secadmin}:${PGPASSWORD:-secpassword}@postgres:5432/${PGDATABASE:-cloud_sec_platform}
      REDIS_URL: redis://redis:6379
      PYTHON_SERVICE_URL: http://python-security-service:8000
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-secplatform_internal_hmac_secret_change_in_prod_9f8a7b6c5d4e3f2a}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-jwt_access_secret_key_change_in_production_min_32_chars_long_01}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-jwt_refresh_secret_key_change_in_production_min_32_chars_long_02}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      FRONTEND_URL: http://localhost
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-security-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secplatform-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: secplatform-gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
